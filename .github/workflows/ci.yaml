permissions:
  contents: read

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # fallow compares against the merge base, so it needs the history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx astro check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Code quality gate
        # Only meaningful on a pull request, where there is a base to diff
        # against. Mirrors the local Claude Code hook.
        if: github.event_name == 'pull_request'
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
        run: bun run fallow:audit

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # Seeds a throwaway database, builds the app and starts it against that
        # database; see e2e/README.md. No real credentials are involved.
        run: bun run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
